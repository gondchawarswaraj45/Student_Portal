{% extends 'base.html' %}

{% block title %}Forgot Password - EduPortal{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your email to receive a password reset link</p>
            </div>

            <form method="POST" class="auth-form">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" name="email" id="id_email" class="form-input" placeholder="Enter your registered email" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <div class="auth-footer">
                <p>Remember your password? <a href="{% url 'accounts:login' %}">Login here</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
