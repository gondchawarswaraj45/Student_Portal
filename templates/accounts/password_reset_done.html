{% extends 'base.html' %}

{% block title %}Password Reset Done - EduPortal{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon icon-success">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1>Email Sent</h1>
                <p>We've sent an email with instructions to reset your password. Check your inbox (and spam folder).</p>
            </div>
            <div class="auth-footer">
                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
